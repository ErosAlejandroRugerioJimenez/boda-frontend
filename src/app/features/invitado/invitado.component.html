<div class="contenedor-movil">
  <div class="tarjeta-cristal">
    
    <div class="cabecera">
      <h1 class="titulo-boda">
        <!-- SE ACTUALIZÓ EL COLOR A #a68a48 -->
        <i class="fa-solid fa-ring" style="color: #a68a48;"></i> ¡Deja tu saludo! <i class="fa-solid fa-champagne-glasses" style="color: #a68a48;"></i>
      </h1>
      <p class="subtitulo">Los novios y el DJ leerán tu mensaje en la pantalla principal.</p>
    </div>

    <form (ngSubmit)="enviar()" #saludoForm="ngForm" *ngIf="!enviado" class="formulario">
      
      <mat-form-field appearance="outline" class="campo-completo input-cristal">
        <mat-label>Tu Nombre o Familia</mat-label>
        <input matInput [(ngModel)]="mensaje.invitado" name="invitado" required [disabled]="enviando">
      </mat-form-field>

      <mat-form-field appearance="outline" class="campo-completo input-cristal">
        <mat-label>Tu Mensaje</mat-label>
        <textarea matInput #mensajeInput [(ngModel)]="mensaje.texto" name="texto" rows="4" required [disabled]="enviando" maxlength="200"></textarea>
        <mat-hint align="end">{{ mensajeInput.value.length }} / 200</mat-hint>
      </mat-form-field>

      <div class="seccion-foto">
        <input type="file" #inputFoto accept="image/*" (change)="onFotoSeleccionada($event)" style="display: none;">
        
        <button type="button" class="btn-adjuntar" (click)="inputFoto.click()" [disabled]="enviando">
          <i class="fa-solid fa-camera"></i> {{ nombreArchivo ? 'Cambiar foto' : 'Adjuntar foto (Opcional)' }}
        </button>
        
        <div *ngIf="previsualizacionUrl" class="preview-contenedor">
          <div class="preview-wrapper">
            <button type="button" class="btn-quitar-foto" (click)="quitarFoto(inputFoto)" title="Quitar foto">
              <i class="fa-solid fa-xmark"></i>
            </button>
            <img [src]="previsualizacionUrl" alt="Previsualización" class="img-preview">
          </div>
        </div>
      </div>
      
<p *ngIf="nombreArchivo" class="nombre-archivo">
  <i class="fa-solid fa-circle-check" style="color: #a68a48;"></i> Imagen adjuntada correctamente
</p>
      
      <button type="submit" [disabled]="enviando || saludoForm.invalid" class="btn-enviar">
        <span *ngIf="!enviando"><i class="fa-solid fa-paper-plane"></i> Enviar Saludo</span>
        <mat-spinner diameter="24" *ngIf="enviando"></mat-spinner>
      </button>

    </form>

    <div class="mensaje-exito" *ngIf="enviado">
      <!-- SE ACTUALIZÓ EL COLOR A #a68a48 -->
      <h2 class="titulo-exito" style="color: #a68a48;">¡Gracias! <i class="fa-solid fa-wand-magic-sparkles" style="color: #a68a48;"></i></h2>
      <!-- SE AGREGO COLOR EXPLICITO GRIS OSCURO PARA LEGIBILIDAD -->
      <p style="color: #333;">Tu mensaje ya está en la pantalla del DJ.</p>
    </div>

  </div>
  <footer class="footer-invitados">
  <p>&copy; 2026 Biglat Technologies.</p>
</footer>

</div>
